<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#34d399" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Base com Borda Executiva -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Monograma JB Arquitetonico -->
  <!-- Letra J -->
  <path d="M 23 20 L 29 20 L 29 37 C 29 41.5 25.5 44.5 21 44.5 C 17.5 44.5 15 42.5 14 40.5" 
        fill="none" stroke="#F4F4F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letra B -->
  <path d="M 34 20 L 34 44.5 M 34 20 L 41.5 20 C 45 20 47.5 22.5 47.5 26 C 47.5 29.5 45 32 41.5 32 L 34 32 M 34 32 L 42.5 32 C 46.5 32 49.5 34.5 49.5 38.2 C 49.5 42 46.5 44.5 42.5 44.5 L 34 44.5" 
        fill="none" stroke="#F4F4F6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data Node Esmeralda -->
  <circle cx="50" cy="14" r="4.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="2" fill="#FFFFFF"/>
</svg>
