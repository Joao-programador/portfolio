    else if (url.includes('/d/')) fileId = url.split('/d/')[1].split('/')[0];
    if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
    return url.startsWith('http') ? url : null;

function toggleFilterDropdown(colId, event) {
    const el = document.getElementById(`dropdown-${colId}`);
    if(el) {
        el.classList.toggle('hidden');
        const icon = document.getElementById(`icon-${colId}`);
        if (icon) {
            icon.innerText = el.classList.contains('hidden') ? 'keyboard_arrow_down' : 'keyboard_arrow_up';
        }
    }
    if (event) event.stopPropagation();
}

function toggleFilterValue(colName, val) {
    const colId = colName.replace(/\s+/g, '_');
    const set = activeFilters[colName];
    
    if (val === 'ALL') {
        set.clear();
        document.querySelectorAll(`.filter-checkbox-${colId}`).forEach(cb => cb.checked = false);
        const allCb = document.getElementById(`cb-all-${colId}`);
        if(allCb) allCb.checked = true;
    } else {
        if (set.has(val)) {
            set.delete(val);
            const cb = Array.from(document.querySelectorAll(`.filter-checkbox-${colId}`)).find(c => c.value === val);
            if(cb) cb.checked = false;
        } else {
            set.add(val);
            const cb = Array.from(document.querySelectorAll(`.filter-checkbox-${colId}`)).find(c => c.value === val);
            if(cb) cb.checked = true;
        }
        
        const allCb = document.getElementById(`cb-all-${colId}`);
        if(allCb) {
            allCb.checked = set.size === 0;
        }
    }
    
    const nameEl = document.getElementById(`label-name-${colId}`);
    if(nameEl) {
        if (set.size > 0) {
            nameEl.classList.add('text-map-accent');
            nameEl.classList.remove('text-on-surface');
        } else {
            nameEl.classList.remove('text-map-accent');
            nameEl.classList.add('text-on-surface');
        }
    }
    
    applyFilters();
}

function buildFilters() {
    initActiveFilters();
    let html = '';
    Object.keys(filterOptions).forEach(colName => {
        const ops = filterOptions[colName]; if (ops.length === 0) return;
        const colId = colName.replace(/\s+/g, '_');
        html += `

                <span id="icon-${colId}" class="material-symbols-outlined text-[20px] text-on-surface border border-on-surface/30 rounded-full group-hover:border-map-accent group-hover:text-map-accent transition-all p-0.5">keyboard_arrow_down</span>
            </div>

                <label class="flex items-center gap-2.5 p-2 hover:bg-surface-container rounded cursor-pointer transition-colors">
                    <input type="checkbox" id="cb-all-${colId}" value="ALL" class="w-4 h-4 rounded border-outline text-map-accent focus:ring-map-accent cursor-pointer" onchange="toggleFilterValue('${colName}', 'ALL')" checked>
                    <span class="text-[14px] font-medium text-on-surface">Todos</span>
                </label>
        `;
        ops.forEach(opt => {
            const escapedOpt = opt.replace(/'/g, "\\'");
            html += `
                <label class="flex items-start gap-2.5 p-2 hover:bg-surface-container rounded cursor-pointer transition-colors">
                    <input type="checkbox" value="${escapedOpt}" class="w-4 h-4 rounded border-outline text-map-accent focus:ring-map-accent filter-checkbox-${colId} mt-0.5 cursor-pointer" onchange="toggleFilterValue('${colName}', '${escapedOpt}')">
                    <span class="text-[14px] leading-snug text-on-surface">${opt}</span>
                </label>
            `;
        });
        html += `</div></div>`;
    });
    document.getElementById('filterContainer').innerHTML = html;
}

function applyFilters() {
    closeSidebar();
    const searchTxt = document.getElementById('searchInput').value.toLowerCase().trim();
    let countAtivos = 0; let visibleItems = [];

    markersRegistry.forEach(item => {
        let show = true;
        if (searchTxt) {
            const indexText = [item.data['Logradouro'], item.data['Endereço (ex: Rua Libero Badaró, 293)'], item.data['Código do edifício correto']].join(' ').toLowerCase();
            if (!indexText.includes(searchTxt)) show = false;
        }
        if (show) {
            Object.keys(filterOptions).forEach(colName => {
                const set = activeFilters[colName];
                if (set && set.size > 0) {
                    if (!set.has(String(item.data[colName]))) {
                        show = false;
                    }
                }
            });
        }
        if (show) {
            if (!mapInstance.hasLayer(item.layer)) mapInstance.addLayer(item.layer);
            countAtivos++; visibleItems.push(item);
            
            if (item.layer.options.className !== 'marker-animate') {
                item.layer.setStyle({ className: 'marker-animate' });
            }
            if (item.layer._path) {
                item.layer._path.style.animation = 'none';
                void item.layer._path.offsetWidth;
                item.layer._path.style.animation = '';
            }
        } else {
            if (mapInstance.hasLayer(item.layer)) mapInstance.removeLayer(item.layer);
        }
    });

    document.getElementById('counterBadge').innerText = `${countAtivos} ativos encontrados`;
    renderChips(); updateMetrics(visibleItems);
}

function resetFilters() { 
    Object.keys(activeFilters).forEach(colName => {
        activeFilters[colName].clear();
        const colId = colName.replace(/\s+/g, '_');
        const allCb = document.getElementById(`cb-all-${colId}`);
        if (allCb) allCb.checked = true;
        document.querySelectorAll(`.filter-checkbox-${colId}`).forEach(cb => cb.checked = false);
        
        const nameEl = document.getElementById(`label-name-${colId}`);
        if (nameEl) {
            nameEl.classList.remove('text-map-accent');
            nameEl.classList.add('text-on-surface');
        }
    });
    document.getElementById('searchInput').value = ''; 
    applyFilters(); 
}

document.addEventListener('DOMContentLoaded', () => {
    buildFilters();
    const attachEvents = setInterval(() => {
        for (let key in window) {
            if (key.startsWith('map_') && window[key] instanceof L.Map) {
                mapInstance = window[key];

                mapInstance.getContainer().style.width = '100vw';

                mapInstance.invalidateSize();

                }

                mapInstance.eachLayer((layer) => {
                    if (layer instanceof L.CircleMarker) {
                        const lat = layer.getLatLng().lat; const lng = layer.getLatLng().lng;
                        const data = mapData.find(d => Math.abs(d.Latitude - lat) < 0.0001 && Math.abs(d.Longitude - lng) < 0.0001);
                        
                        if (data) {
                            let corPin = '#F08200';
                            let filtroVal = String(data['FILTRO - USO'] || '');
                            if (filtroVal.includes('inteiro estacionamento')) corPin = '#007BFF';
                            else if (filtroVal.includes('ocioso')) corPin = '#28a745';
                            else if (filtroVal.includes('informal')) corPin = '#28a745';
                            
                            layer.setStyle({ fillColor: corPin, color: '#FFFFFF', fillOpacity: 0.8, opacity: 1.0, weight: 1.5 });
                            markersRegistry.push({ layer: layer, data: data });
                            
                            if (!layer.hasSidebarEvent) {
                                layer.on('click', function(e) { openSidebar(data); mapInstance.flyTo([lat, lng], 16, { animate: true, duration: 1 }); });
                                layer.hasSidebarEvent = true;
                            }
                        }
                    }
                });
                
                if (markersRegistry.length > 0) {
                    clearInterval(attachEvents);
                    applyFilters();
                }
            }
        }
    }, 500);
});
