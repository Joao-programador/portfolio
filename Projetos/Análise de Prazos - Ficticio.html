        document.addEventListener('alpine:init', () => {
            Alpine.data('portalApp', () => ({
                activeDash: '',
                isLoading: true,
                expanded: false,
                
                init() {
                    this.$nextTick(() => {
                        // Inicia no dashboard de Modelagem como solicitado
                        this.setActiveDashboard('dash-modelagem'); 
                    });
                },

                setActiveDashboard(id) {
                    if (this.activeDash === id) return;
                    
                    this.activeDash = id;
                    this.isLoading = true;
                    
                    const base64Str = dashData[id];
                    if (base64Str) {
                        try {
                            const binString = window.atob(base64Str);
                            const bytes = new Uint8Array(binString.length);
                            for (let i = 0; i < binString.length; i++) {
                                bytes[i] = binString.charCodeAt(i);
                            }
                            const htmlContent = new TextDecoder('utf-8').decode(bytes);
                            
                            const blob = new Blob([htmlContent], { type: 'text/html' });
                            const url = URL.createObjectURL(blob);
                            
                            const iframe = document.getElementById('dashboard-frame');
                            
                            if (iframe.dataset.blobUrl) {
                                URL.revokeObjectURL(iframe.dataset.blobUrl);
                            }
                            
                            iframe.dataset.blobUrl = url;
                            iframe.src = url;
                        } catch (error) {
                            console.error("Erro ao renderizar dashboard:", error);
                            this.isLoading = false;
                        }
                    }
                },
                
                onIframeLoad() {
                    setTimeout(() => {
                        this.isLoading = false;
                    }, 300);
                }
            }));
        });
    </script>
